Diskussion</header><main id="app"></main><footer><div style="color:#164e46;font-weight:700">Erstellt von Zsuzsanna Cseh</div><div>Dieses Lernmaterial dient ausschließlich Unterrichtszwecken und ersetzt keine medizinische Beratung.</div></footer><script>const M=[["die Akupunktur", "akupunktúra", "🪡", "Bei der Akupunktur werden dünne **Nadeln** an bestimmten Stellen in die Haut gestochen. Diese Stellen nennt man **Akupunkturpunkte**. Die Methode stammt aus China. Sie wird bei Rückenschmerzen, Migräne und Muskelverspannungen eingesetzt. Manche Menschen nutzen sie auch, um **mit dem Rauchen aufzuhören**. Dafür ist die Wirksamkeit nicht zuverlässig belegt.", "Nadeln|Akupunkturpunkte|mit dem Rauchen aufzuhören", "die Nadel – tű|der Akupunkturpunkt – akupunktúrás pont|mit dem Rauchen aufhören – leszokni a dohányzásról|die Wirksamkeit – hatásosság"], ["die Aromatherapie", "aromaterápia", "🌿", "Bei der Aromatherapie verwendet man **ätherische Öle**, die aus Pflanzen gewonnen werden, zum Beispiel aus **Lavendel**, Kamille und Eukalyptus. Man verwendet sie als Badezusatz oder verdünnt als Massageöl. Bei Erkältungen werden manche Öle zur Inhalation genutzt. Angenehme Düfte können helfen, **Stress abzubauen**. Auch allergische Reaktionen sind möglich.", "ätherische Öle|Lavendel|Stress abzubauen", "das ätherische Öl – illóolaj|der Lavendel – levendula|die Kamille – kamilla|der Eukalyptus – eukaliptusz|der Badezusatz – fürdőadalék|Stress abbauen – stresszt levezetni"], ["die Homöopathie", "homeopátia", "⚪", "Homöopathische Mittel werden aus pflanzlichen, tierischen oder mineralischen Ausgangsstoffen hergestellt, die oft stark **verdünnt** werden. Besonders bekannt sind **Globuli**, kleine weiße Kügelchen aus Zucker. Viele Mittel sind **rezeptfrei** in der Apotheke erhältlich. Manche Menschen verwenden sie bei Erkältungen oder Schlafproblemen. Stark verdünnte Mittel haben meist ein geringes direktes Nebenwirkungsrisiko. Eine Wirkung über den Placeboeffekt hinaus ist nicht zuverlässig nachgewiesen.", "verdünnt|Globuli|rezeptfrei", "verdünnen – hígítani|die Globuli (Pl.) – golyócskák|das Kügelchen – golyócska|rezeptfrei erhältlich – vény nélkül kapható|die Nebenwirkung – mellékhatás"], ["die Behandlung mit Heilpflanzen", "gyógynövényes kezelés", "🌼", "Man verwendet **Blüten**, Blätter und Wurzeln von Heilpflanzen. Daraus werden Tees, Tropfen, Salben und Tabletten hergestellt. Kamillentee wird bei leichten Magen-Darm-Beschwerden getrunken, Thymian bei Husten verwendet. Lavendel kann beruhigend wirken. **Pflanzliche Wirkstoffe** können Beschwerden lindern, aber auch **Nebenwirkungen** haben.", "Blüten|Pflanzliche Wirkstoffe|Nebenwirkungen", "die Blüte – virág|das Blatt – levél|die Wurzel – gyökér|die Salbe – kenőcs|der pflanzliche Wirkstoff – növényi hatóanyag|die Nebenwirkung – mellékhatás"], ["die Massage", "masszázs", "🤲", "Bei einer Massage werden Muskeln mit verschiedenen Handgriffen behandelt. Dadurch kann man **Verspannungen lösen** und die **Durchblutung fördern**. Viele Menschen lassen sich bei Rücken- oder Nackenschmerzen massieren. Sportler nutzen Massagen zur Regeneration. Andere betrachten eine Massage als Wellnessangebot, um sich zu entspannen und **neue Energie zu tanken**. Bei akuten Verletzungen ist Vorsicht nötig.", "Verspannungen lösen|Durchblutung fördern|neue Energie zu tanken", "der Handgriff – fogás|Verspannungen lösen – izomfeszülést oldani|die Durchblutung fördern – vérkeringést serkenteni|sich massieren lassen – megmasszíroztatni magát|neue Energie tanken – feltöltődni"], ["das Yoga", "jóga", "🧘", "Yoga stammt aus Indien und verbindet körperliche Übungen, **Atemübungen** und Meditation. Regelmäßiges Yoga kann die Muskeln stärken, die **Beweglichkeit verbessern** und Stress abbauen. Viele Menschen machen Yoga bei Verspannungen oder um einen **Ausgleich zum Alltag** zu finden. Man kann zu Hause oder im Yogastudio üben. Meist braucht man nur bequeme Kleidung und eine Yogamatte.", "Atemübungen|Beweglichkeit verbessern|Ausgleich zum Alltag", "die Atemübung – légzőgyakorlat|die Beweglichkeit verbessern – mozgékonyságot javítani|einen Ausgleich finden – ellensúlyt találni|die Yogamatte – jógamatrac"]];const D=[{"title": "Bilder und Heilmethoden", "items": [{"q": "Welche Methode ist zu sehen?", "a": "die Akupunktur", "opts": ["die Akupunktur", "die Aromatherapie", "die Homöopathie", "die Behandlung mit Heilpflanzen", "die Massage", "das Yoga"], "pic": 0}, {"q": "Welche Methode ist zu sehen?", "a": "die Aromatherapie", "opts": ["die Akupunktur", "die Aromatherapie", "die Homöopathie", "die Behandlung mit Heilpflanzen", "die Massage", "das Yoga"], "pic": 1}, {"q": "Welche Methode ist zu sehen?", "a": "die Homöopathie", "opts": ["die Akupunktur", "die Aromatherapie", "die Homöopathie", "die Behandlung mit Heilpflanzen", "die Massage", "das Yoga"], "pic": 2}, {"q": "Welche Methode ist zu sehen?", "a": "die Behandlung mit Heilpflanzen", "opts": ["die Akupunktur", "die Aromatherapie", "die Homöopathie", "die Behandlung mit Heilpflanzen", "die Massage", "das Yoga"], "pic": 3}, {"q": "Welche Methode ist zu sehen?", "a": "die Massage", "opts": ["die Akupunktur", "die Aromatherapie", "die Homöopathie", "die Behandlung mit Heilpflanzen", "die Massage", "das Yoga"], "pic": 4}, {"q": "Welche Methode ist zu sehen?", "a": "das Yoga", "opts": ["die Akupunktur", "die Aromatherapie", "die Homöopathie", "die Behandlung mit Heilpflanzen", "die Massage", "das Yoga"], "pic": 5}]}, {"title": "Heilmethoden und ihre Merkmale", "items": []}, {"title": "Heilpflanzen und Wirkung", "items": [{"q": "kamilla", "a": "die Kamille", "hu": "kamilla", "opts": ["die Kamille", "die Pfefferminze", "der Lavendel", "der Thymian", "die Brennnessel", "der Eukalyptus", "schleimlösend", "entzündungshemmend", "beruhigend", "krampflösend", "die Wurzel", "das Blatt"]}, {"q": "borsmenta", "a": "die Pfefferminze", "hu": "borsmenta", "opts": ["die Kamille", "die Pfefferminze", "der Lavendel", "der Thymian", "die Brennnessel", "der Eukalypt
